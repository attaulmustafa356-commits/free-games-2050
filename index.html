<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE GAMES 2050 // ULTIMATE ARCADE PORTAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: #01030d;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 2030 HUD UI Elements */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            color: #00f0ff;
            font-size: 1rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
            pointer-events: none;
        }

        .hud-panel {
            background: rgba(0, 10, 25, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 10px 20px;
            border-radius: 6px;
            backdrop-filter: blur(6px);
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(1, 3, 13, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
        }

        .screen-overlay h1 {
            font-size: 2.5rem;
            color: #00f0ff;
            margin-bottom: 15px;
            text-shadow: 0 0 20px #00f0ff;
            letter-spacing: 5px;
        }

        .screen-overlay p {
            font-size: 1.1rem;
            color: #ff007f;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff007f;
        }

        .cyber-btn {
            background: linear-gradient(45deg, #00f0ff, #ff007f);
            border: none;
            color: #fff;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 3px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transition: 0.3s;
        }

        .cyber-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px #ff007f;
        }
    </style>
</head>
<body>

    <!-- HUD Overlay -->
    <div class="hud-overlay">
        <div class="hud-panel">GAME: <span style="color:#ffcc00;">CYBER_GRID 2030 (FEATURED #1)</span></div>
        <div class="hud-panel">LEVEL: <span id="levelDisplay">1</span> / 100</div>
        <div class="hud-panel">SPEED: <span id="speedDisplay">120</span> KM/H</div>
        <div class="hud-panel">DESTINATION: <span id="distDisplay">0</span> KM</div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="startScreen" class="screen-overlay">
        <h1>CYBER_GRID // 2030 RACER</h1>
        <p>FEATURED #1 GAME // 100 QUANTUM LEVELS // 1000 KM TRACKS</p>
        <button class="cyber-btn" onclick="startGame()">INITIALIZE ENGINE</button>
    </div>

    <!-- Level Complete Screen -->
    <div id="levelScreen" class="screen-overlay" style="display: none;">
        <h1 style="color: #00ff66; text-shadow: 0 0 20px #00ff66;">LEVEL CLEARED</h1>
        <p id="nextLevelText">PREPARING NEXT QUANTUM SECTOR...</p>
        <button class="cyber-btn" onclick="nextLevel()">PROCEED TO NEXT LEVEL</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen-overlay" style="display: none;">
        <h1 style="color: #ff0055; text-shadow: 0 0 20px #ff0055;">SYSTEM CRASHED</h1>
        <p>OBSTACLE IMPACT DETECTED IN SECTOR</p>
        <button class="cyber-btn" onclick="restartGame()">REBOOT SYSTEM</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameState = 'START';
        let currentLevel = 1;
        let maxLevels = 100;
        let scoreDistance = 0;
        let targetDistance = 1000;
        let gameSpeed = 6;
        let roadOffset = 0;

        let player = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            width: 45,
            height: 85,
            speed: 7.5,
            color: '#00f0ff'
        };

        let obstacles = [];
        let keys = { ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        function startGame() {
            currentLevel = 1;
            initLevel();
            document.getElementById('startScreen').style.display = 'none';
            gameState = 'PLAYING';
        }

        function initLevel() {
            scoreDistance = 0;
            gameSpeed = 5.5 + (currentLevel * 0.1);
            targetDistance = 1000 + ((currentLevel - 1) * 200); 
            obstacles = [];
            player.x = canvas.width / 2;
            document.getElementById('levelDisplay').innerText = currentLevel;
        }

        function nextLevel() {
            if (currentLevel < maxLevels) {
                currentLevel++;
                document.getElementById('levelScreen').style.display = 'none';
                initLevel();
                gameState = 'PLAYING';
            } else {
                alert('CONGRATULATIONS! YOU HAVE CONQUERED ALL 100 CYBER LEVELS!');
                startGame();
            }
        }

        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            initLevel();
            gameState = 'PLAYING';
        }

        function spawnObstacles() {
            if (Math.random() < 0.025 + (currentLevel * 0.0004)) {
                let roadWidth = 400;
                let roadLeft = (canvas.width - roadWidth) / 2;
                let obsX = roadLeft + Math.random() * (roadWidth - 50);
                
                obstacles.push({
                    x: obsX,
                    y: -100,
                    width: 45,
                    height: 85,
                    speed: gameSpeed * 0.5 + Math.random() * 1.5,
                    color: '#ff007f'
                });
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            if (keys.ArrowLeft && player.x > (canvas.width - 400) / 2) {
                player.x -= player.speed;
            }
            if (keys.ArrowRight && player.x < (canvas.width + 400) / 2 - player.width) {
                player.x += player.speed;
            }

            roadOffset += gameSpeed;
            if (roadOffset > 40) roadOffset = 0;

            scoreDistance += gameSpeed * 0.15;
            let currentKM = Math.floor(scoreDistance);
            let remainingKM = Math.max(0, targetDistance - currentKM);

            document.getElementById('distDisplay').innerText = remainingKM + ' KM';
            document.getElementById('speedDisplay').innerText = Math.floor(gameSpeed * 22);

            if (currentKM >= targetDistance) {
                gameState = 'LEVEL_WON';
                document.getElementById('nextLevelText').innerText = `SECTOR ${currentLevel} DESTINATION REACHED! READY FOR LEVEL ${currentLevel + 1}?`;
                document.getElementById('levelScreen').style.display = 'flex';
                return;
            }

            spawnObstacles();
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed;

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    gameState = 'GAMEOVER';
                    document.getElementById('gameOverScreen').style.display = 'flex';
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#01030d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let roadWidth = 400;
            let roadLeft = (canvas.width - roadWidth) / 2;

            ctx.fillStyle = '#080e21';
            ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(roadLeft, 0);
            ctx.lineTo(roadLeft, canvas.height);
            ctx.moveTo(roadLeft + roadWidth, 0);
            ctx.lineTo(roadLeft + roadWidth, canvas.height);
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            for (let obs of obstacles) {
                ctx.fillStyle = obs.color;
                ctx.shadowColor = obs.color;
                ctx.shadowBlur = 15;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillStyle = '#000';
                ctx.fillRect(obs.x + 8, obs.y + 15, obs.width - 16, 20);
            }
            ctx.shadowBlur = 0;

            ctx.fillStyle = player.color;
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 20;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 8, player.y + 20, player.width - 16, 22);
            ctx.fillStyle = '#ff007f';
            ctx.fillRect(player.x + 5, player.y + player.height - 8, player.width - 10, 6);
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
